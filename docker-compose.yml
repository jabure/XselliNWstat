services:
  xselli-stats:
    build: .
    container_name: xselli-stats-rechner
    restart: unless-stopped
    # Kein "ports:" mehr: Die App ist nur noch über das Docker-Netzwerk "proxy" (Caddy) erreichbar,
    # nicht mehr direkt im Heimnetz auf Port 3001 - dort wäre HTTPS umgehbar und die IP fälschbar.
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      # Kein öffentlicher Standardwert mehr: Ist JWT_SECRET leer, erzeugt der Server
      # einmalig ein zufälliges Secret (data/.jwt-secret). Besser: in der .env setzen.
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Xselli}
      # Optional: Einladungscode für die Registrierung (leer = jeder darf sich registrieren)
      - REGISTER_CODE=${REGISTER_CODE:-}
      # Angaben für Impressum und Datenschutzerklärung (Adresse: Zeilen mit | trennen)
      - LEGAL_NAME=${LEGAL_NAME:-}
      - LEGAL_ADDRESS=${LEGAL_ADDRESS:-}
      - LEGAL_EMAIL=${LEGAL_EMAIL:-}
      - LEGAL_PHONE=${LEGAL_PHONE:-}
    # Schlankere Rechte: der Prozess kann sich keine neuen Rechte verschaffen und hat nur die
    # wenigen Linux-Fähigkeiten, die der Start-Wrapper braucht (Besitzer setzen, Benutzer wechseln).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    networks:
      - proxy
    # Läuft mit sehr wenig Ressourcen - diese Grenzen sind großzügig bemessen,
    # nicht weil die App das braucht, sondern damit sie unter keinen Umständen
    # andere Dienste auf deinem Server stören kann.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  # Muss auf dem Server schon existieren (z.B. von deinem Reverse Proxy angelegt).
  # Falls nicht: einmalig `docker network create proxy` ausführen.
  proxy:
    external: true
